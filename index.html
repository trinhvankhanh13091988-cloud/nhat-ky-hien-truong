<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1769aa"><link rel="manifest" href="manifest.json"><title>Nhật ký hiện trường V3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:#17212b;font:14px Arial}header{background:#1769aa;color:#fff;padding:12px;position:sticky;top:0;z-index:5}h1{font-size:20px;margin:0 0 8px}nav{display:flex;gap:5px;flex-wrap:wrap}button,.btn{border:0;border-radius:7px;padding:8px 11px;cursor:pointer}nav button{color:#15558a}.page.hidden{display:none}main{max-width:1300px;margin:auto;padding:14px}.card{background:#fff;border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #0001}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.field{display:flex;flex-direction:column;gap:4px}.field label{font-size:12px;font-weight:bold;color:#5d6872}input,select,textarea{padding:8px;border:1px solid #ccd3da;border-radius:6px;font:inherit}textarea{min-height:65px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.btn{background:#1769aa;color:white}.gray{background:#68737d!important}.red{background:#c62828!important}.green{background:#188038!important}table{width:100%;border-collapse:collapse;margin-top:8px}th,td{border:1px solid #d5dbe0;padding:6px;font-size:12px}th{background:#edf2f6}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{background:white;padding:13px;border-radius:9px;border-left:4px solid #1769aa}.kpi b{display:block;font-size:22px;margin-top:4px}.bar{height:9px;background:#e2e7eb;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#1769aa}.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.photos img{width:100%;height:120px;object-fit:cover;border-radius:5px}.report{background:#fff;padding:8mm}.meta{display:grid;grid-template-columns:1fr 1fr;font-size:11px;gap:2px 14px}.report h1,.report h2{text-align:center}.report h1{font-size:17px}.report h3{font-size:12px;margin:7px 0 3px}.sign{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;font-size:11px}.sign div{min-height:70px}@media(max-width:800px){.grid,.kpis{grid-template-columns:1fr 1fr}.photos{grid-template-columns:1fr 1fr}}@media print{.no-print{display:none!important}main{padding:0}@page{size:A4 landscape;margin:8mm}}
</style></head><body>
<header class="no-print"><h1>📋 NHẬT KÝ HIỆN TRƯỜNG V3</h1><nav>
<button onclick="go('dash')">Tổng quan</button><button onclick="go('projects')">Dự án</button><button onclick="go('daily')">Nhật ký</button><button onclick="go('labor')">Nhân công</button><button onclick="go('machine')">Máy</button><button onclick="go('material')">Vật tư</button><button onclick="go('qty')">Khối lượng</button><button onclick="go('report')">Báo cáo</button><button onclick="go('backup')">Sao lưu</button></nav></header><main>
<section id="dash" class="page"><div class="kpis"><div class="kpi">Dự án<b id="np">0</b></div><div class="kpi">Nhật ký<b id="nd">0</b></div><div class="kpi">Nhân công<b id="nl">0</b></div><div class="kpi">Khối lượng<b id="nq">0</b></div></div><div class="card"><h2>Tổng quan dự án</h2><div id="dashboard"></div></div></section>

<section id="projects" class="page hidden"><div class="card"><h2>Quản lý dự án</h2><div class="grid">
<div class="field"><label>Mã dự án</label><input id="pc"></div><div class="field"><label>Tên dự án</label><input id="pn"></div><div class="field"><label>Chủ đầu tư</label><input id="po"></div><div class="field"><label>Đơn vị thi công</label><input id="pt"></div><div class="field"><label>Tư vấn giám sát</label><input id="ps"></div><div class="field"><label>Địa điểm</label><input id="pl"></div><div class="field"><label>Ngày khởi công</label><input id="pstart" type="date"></div><div class="field"><label>Ngày hoàn thành</label><input id="pend" type="date"></div></div><div class="actions"><button class="btn" onclick="saveProject()">Lưu dự án</button><button class="btn gray" onclick="clearProject()">Nhập mới</button></div></div><div class="card" id="projectList"></div></section>

<section id="daily" class="page hidden"><div class="card"><h2>Nhật ký ngày</h2><div class="grid">
<div class="field"><label>Ngày</label><input id="dd" type="date"></div><div class="field"><label>Dự án</label><select id="dp"></select></div><div class="field"><label>Hạng mục / công việc</label><input id="dw"></div><div class="field"><label>Vị trí</label><input id="dl"></div><div class="field"><label>Thời tiết</label><input id="dweather"></div><div class="field"><label>Tổ/Đội thi công</label><input id="dteam"></div><div class="field"><label>Cán bộ kỹ thuật</label><input id="dtech"></div><div class="field"><label>Chỉ huy trưởng</label><input id="dchief"></div></div><div class="field"><label>Nội dung / ghi chú</label><textarea id="dn"></textarea></div><div class="field"><label>Ảnh hiện trường (tối đa 2MB/ảnh)</label><input id="dphoto" type="file" accept="image/*" multiple></div><div class="actions"><button class="btn" onclick="saveDaily()">Lưu nhật ký</button><button class="btn gray" onclick="clearDaily()">Nhập mới</button></div></div><div class="card" id="dailyList"></div></section>

<section id="labor" class="page hidden"><div class="card"><h2>Nhân công</h2><div class="grid"><div class="field"><label>Ngày</label><input id="ld" type="date"></div><div class="field"><label>Dự án</label><select id="lp"></select></div><div class="field"><label>Họ tên / nhóm</label><input id="lname"></div><div class="field"><label>Tổ/Đội</label><input id="lteam"></div><div class="field"><label>Công việc</label><input id="ljob"></div><div class="field"><label>Số người</label><input id="lcount" type="number" min="0"></div><div class="field"><label>Ngày công</label><input id="ldays" type="number" min="0" step=".5"></div></div><button class="btn" onclick="saveLabor()">Lưu</button></div><div class="card" id="laborList"></div></section>

<section id="machine" class="page hidden"><div class="card"><h2>Máy thi công</h2><div class="grid"><div class="field"><label>Ngày</label><input id="md" type="date"></div><div class="field"><label>Dự án</label><select id="mp"></select></div><div class="field"><label>Loại máy</label><input id="mtype"></div><div class="field"><label>Mã/biển số</label><input id="mcode"></div><div class="field"><label>Lái máy</label><input id="mdriver"></div><div class="field"><label>Số giờ</label><input id="mhours" type="number" min="0" step=".5"></div></div><button class="btn" onclick="saveMachine()">Lưu</button></div><div class="card" id="machineList"></div></section>

<section id="material" class="page hidden"><div class="card"><h2>Vật tư sử dụng trong ngày</h2><div class="grid"><div class="field"><label>Ngày</label><input id="vd" type="date"></div><div class="field"><label>Dự án</label><select id="vp"></select></div><div class="field"><label>Tên vật tư</label><input id="vname"></div><div class="field"><label>Đơn vị</label><input id="vunit"></div><div class="field"><label>Khối lượng</label><input id="vqty" type="number" min="0" step=".001"></div><div class="field"><label>Nguồn / nhà cung cấp</label><input id="vsource"></div></div><button class="btn" onclick="saveMaterial()">Lưu</button></div><div class="card" id="materialList"></div></section>

<section id="qty" class="page hidden"><div class="card"><h2>Tiến độ & khối lượng</h2><div class="grid"><div class="field"><label>Ngày</label><input id="qd" type="date"></div><div class="field"><label>Dự án</label><select id="qp"></select></div><div class="field"><label>Hạng mục</label><input id="qitem"></div><div class="field"><label>Đơn vị</label><input id="qunit"></div><div class="field"><label>Khối lượng kế hoạch</label><input id="qplan" type="number" min="0" step=".001"></div><div class="field"><label>Thực hiện trong ngày</label><input id="qtoday" type="number" min="0" step=".001"></div></div><button class="btn" onclick="saveQty()">Lưu</button></div><div class="card" id="qtyList"></div></section>

<section id="report" class="page hidden"><div class="card no-print"><h2>Báo cáo hiện trường hằng ngày</h2><div class="grid"><div class="field"><label>Dự án</label><select id="rp" onchange="renderReport()"></select></div><div class="field"><label>Ngày báo cáo</label><input id="rd" type="date" onchange="renderReport()"></div></div><button class="btn green" onclick="print()">🖨 In / Lưu PDF</button></div><div id="reportArea"></div></section>

<section id="backup" class="page hidden"><div class="card"><h2>Sao lưu dữ liệu</h2><p>Dữ liệu lưu trên thiết bị/trình duyệt. Nên xuất JSON định kỳ.</p><button class="btn" onclick="backup()">Xuất JSON</button> <label class="btn gray">Nhập JSON<input hidden type="file" accept=".json" onchange="restore(this.files[0])"></label> <button class="btn red" onclick="resetAll()">Xóa toàn bộ</button></div></section>
</main>
<script>
const K='NKHT_V3_FINAL_2026',$=x=>document.getElementById(x),today=new Date().toISOString().slice(0,10);
let db=JSON.parse(localStorage.getItem(K)||'null')||{projects:[],daily:[],labor:[],machine:[],material:[],qty:[],settings:{project:''}};
['dd','ld','md','vd','qd','rd'].forEach(x=>$(x).value=today);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2),pname=id=>db.projects.find(p=>p.id===id)?.name||'';
function persist(){localStorage.setItem(K,JSON.stringify(db));refresh()} function go(id){document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden');refresh()}
function options(){['dp','lp','mp','vp','qp','rp'].forEach(id=>{let e=$(id),old=e.value;e.innerHTML='<option value="">-- Chọn dự án --</option>'+db.projects.map(p=>`<option value="${p.id}">${esc(p.code)} - ${esc(p.name)}</option>`).join('');e.value=old||db.settings.project||db.projects[0]?.id||''})}
function saveProject(){let id=$('pc').dataset.id||uid(),p={id,code:$('pc').value.trim(),name:$('pn').value.trim(),owner:$('po').value,contractor:$('pt').value,supervisor:$('ps').value,location:$('pl').value,start:$('pstart').value,end:$('pend').value};if(!p.code||!p.name)return alert('Nhập mã và tên dự án');let i=db.projects.findIndex(x=>x.id===id);i>=0?db.projects[i]=p:db.projects.push(p);db.settings.project=id;clearProject();persist()}
function clearProject(){['pc','pn','po','pt','ps','pl','pstart','pend'].forEach(x=>$(x).value='');$('pc').dataset.id=''}
function editProject(id){let p=db.projects.find(x=>x.id===id);[['pc','code'],['pn','name'],['po','owner'],['pt','contractor'],['ps','supervisor'],['pl','location'],['pstart','start'],['pend','end']].forEach(a=>$(a[0]).value=p[a[1]]||'');$('pc').dataset.id=id;go('projects')}
function del(t,id){if(confirm('Xóa bản ghi này?')){db[t]=db[t].filter(x=>x.id!==id);persist()}}
function saveDaily(){let fs=[...$('dphoto').files];if(fs.some(f=>f.size>2097152))return alert('Có ảnh vượt 2MB');Promise.all(fs.map(f=>new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res({name:f.name,data:r.result});r.onerror=rej;r.readAsDataURL(f)}))).then(photos=>{db.daily.push({id:uid(),date:$('dd').value,project:$('dp').value,work:$('dw').value,location:$('dl').value,weather:$('dweather').value,team:$('dteam').value,tech:$('dtech').value,chief:$('dchief').value,note:$('dn').value,photos});persist();clearDaily()})}
function clearDaily(){['dw','dl','dweather','dteam','dtech','dchief','dn','dphoto'].forEach(x=>$(x).value='')}
function saveLabor(){db.labor.push({id:uid(),date:$('ld').value,project:$('lp').value,name:$('lname').value,team:$('lteam').value,job:$('ljob').value,count:+$('lcount').value,days:+$('ldays').value});persist()}
function saveMachine(){db.machine.push({id:uid(),date:$('md').value,project:$('mp').value,type:$('mtype').value,code:$('mcode').value,driver:$('mdriver').value,hours:+$('mhours').value});persist()}
function saveMaterial(){db.material.push({id:uid(),date:$('vd').value,project:$('vp').value,name:$('vname').value,unit:$('vunit').value,qty:+$('vqty').value,source:$('vsource').value});persist()}
function saveQty(){db.qty.push({id:uid(),date:$('qd').value,project:$('qp').value,item:$('qitem').value,unit:$('qunit').value,plan:+$('qplan').value,today:+$('qtoday').value});persist()}
const dbtn=(t,id)=>`<button onclick="del('${t}','${id}')">Xóa</button>`;
function tables(){
$('projectList').innerHTML='<table><tr><th>Mã</th><th>Tên dự án</th><th>CĐT</th><th>Địa điểm</th><th></th></tr>'+db.projects.map(p=>`<tr><td>${esc(p.code)}</td><td>${esc(p.name)}</td><td>${esc(p.owner)}</td><td>${esc(p.location)}</td><td><button onclick="editProject('${p.id}')">Sửa</button> ${dbtn('projects',p.id)}</td></tr>`).join('')+'</table>';
$('dailyList').innerHTML='<table><tr><th>Ngày</th><th>Dự án</th><th>Công việc</th><th>Vị trí</th><th>Thời tiết</th><th>Ảnh</th><th></th></tr>'+db.daily.slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${esc(pname(x.project))}</td><td>${esc(x.work)}</td><td>${esc(x.location)}</td><td>${esc(x.weather)}</td><td>${x.photos?.length||0}</td><td>${dbtn('daily',x.id)}</td></tr>`).join('')+'</table>';
$('laborList').innerHTML='<table><tr><th>Ngày</th><th>Dự án</th><th>Nhóm</th><th>Tổ</th><th>Công việc</th><th>Người</th><th>Công</th><th></th></tr>'+db.labor.slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${esc(pname(x.project))}</td><td>${esc(x.name)}</td><td>${esc(x.team)}</td><td>${esc(x.job)}</td><td>${x.count}</td><td>${x.days}</td><td>${dbtn('labor',x.id)}</td></tr>`).join('')+'</table>';
$('machineList').innerHTML='<table><tr><th>Ngày</th><th>Dự án</th><th>Máy</th><th>Mã</th><th>Lái máy</th><th>Giờ</th><th></th></tr>'+db.machine.slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${esc(pname(x.project))}</td><td>${esc(x.type)}</td><td>${esc(x.code)}</td><td>${esc(x.driver)}</td><td>${x.hours}</td><td>${dbtn('machine',x.id)}</td></tr>`).join('')+'</table>';
$('materialList').innerHTML='<table><tr><th>Ngày</th><th>Dự án</th><th>Vật tư</th><th>ĐVT</th><th>KL</th><th>Nguồn</th><th></th></tr>'+db.material.slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${esc(pname(x.project))}</td><td>${esc(x.name)}</td><td>${esc(x.unit)}</td><td>${x.qty}</td><td>${esc(x.source)}</td><td>${dbtn('material',x.id)}</td></tr>`).join('')+'</table>';
let g={};db.qty.forEach(x=>{let k=x.project+'|'+x.item+'|'+x.unit;(g[k]??={project:x.project,item:x.item,unit:x.unit,plan:x.plan,cum:0}).cum+=+x.today||0});$('qtyList').innerHTML='<table><tr><th>Dự án</th><th>Hạng mục</th><th>ĐVT</th><th>KH</th><th>Lũy kế</th><th>%</th></tr>'+Object.values(g).map(x=>`<tr><td>${esc(pname(x.project))}</td><td>${esc(x.item)}</td><td>${esc(x.unit)}</td><td>${x.plan}</td><td>${x.cum.toFixed(3)}</td><td>${x.plan?(x.cum/x.plan*100).toFixed(1):0}%</td></tr>`).join('')+'</table>'}
function dashboard(){$('np').textContent=db.projects.length;$('nd').textContent=db.daily.length;$('nl').textContent=db.labor.length;$('nq').textContent=db.qty.length;$('dashboard').innerHTML=db.projects.map(p=>{let a=db.qty.filter(x=>x.project===p.id),plan=a.reduce((s,x)=>s+(+x.plan||0),0),done=a.reduce((s,x)=>s+(+x.today||0),0),pc=plan?Math.min(100,done/plan*100):0;return `<div style="margin:10px 0"><b>${esc(p.code)} - ${esc(p.name)}</b><div class="bar"><i style="width:${pc}%"></i></div>${pc.toFixed(1)}%</div>`}).join('')||'Chưa có dự án.'}
function renderReport(){let pid=$('rp').value,d=$('rd').value,p=db.projects.find(x=>x.id===pid)||{},ds=db.daily.filter(x=>x.project===pid&&x.date===d),ls=db.labor.filter(x=>x.project===pid&&x.date===d),ms=db.machine.filter(x=>x.project===pid&&x.date===d),vs=db.material.filter(x=>x.project===pid&&x.date===d),qs=db.qty.filter(x=>x.project===pid&&x.date===d),pics=ds.flatMap(x=>x.photos||[]),cum=i=>db.qty.filter(x=>x.project===pid&&x.item===i).reduce((s,x)=>s+(+x.today||0),0);
$('reportArea').innerHTML=`<div class="report"><div style="text-align:center;font-weight:bold;font-size:11px">CÔNG TY TNHH PHÁT TRIỂN VÀ XÂY DỰNG THƯƠNG MẠI AN THỊNH</div><h1>BÁO CÁO HIỆN TRƯỜNG HẰNG NGÀY</h1><div class="meta"><div><b>Tên công trình:</b> ${esc(p.name)}</div><div><b>Hạng mục thi công:</b> ${esc(ds.map(x=>x.work).filter(Boolean).join('; '))}</div><div><b>Địa điểm:</b> ${esc(p.location)}</div><div><b>Ngày báo cáo:</b> ${d}</div><div><b>Thời tiết:</b> ${esc(ds[0]?.weather)}</div><div><b>Chỉ huy trưởng:</b> ${esc(ds[0]?.chief)}</div><div><b>Cán bộ kỹ thuật:</b> ${esc(ds[0]?.tech)}</div><div><b>Tổ/Đội thi công:</b> ${esc(ds[0]?.team)}</div></div>
<h3>I. NHÂN CÔNG THI CÔNG TRONG NGÀY</h3><table><tr><th>STT</th><th>Họ tên/nhóm</th><th>Tổ/Đội</th><th>Công việc</th><th>Số người</th><th>Ngày công</th></tr>${ls.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${esc(x.team)}</td><td>${esc(x.job)}</td><td>${x.count}</td><td>${x.days}</td></tr>`).join('')}</table>
<h3>II. MÁY THI CÔNG</h3><table><tr><th>STT</th><th>Loại máy</th><th>Mã/biển số</th><th>Lái máy</th><th>Giờ</th></tr>${ms.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.type)}</td><td>${esc(x.code)}</td><td>${esc(x.driver)}</td><td>${x.hours}</td></tr>`).join('')}</table>
<h3>III. VẬT TƯ SỬ DỤNG TRONG NGÀY</h3><table><tr><th>STT</th><th>Vật tư</th><th>ĐVT</th><th>Khối lượng</th><th>Nguồn</th></tr>${vs.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${esc(x.unit)}</td><td>${x.qty}</td><td>${esc(x.source)}</td></tr>`).join('')}</table>
<h3>IV. TIẾN ĐỘ & KHỐI LƯỢNG THỰC HIỆN TRONG NGÀY</h3><table><tr><th>STT</th><th>Hạng mục</th><th>ĐVT</th><th>KH</th><th>Trong ngày</th><th>Lũy kế</th><th>%</th></tr>${qs.map((x,i)=>{let c=cum(x.item),pc=x.plan?c/x.plan*100:0;return `<tr><td>${i+1}</td><td>${esc(x.item)}</td><td>${esc(x.unit)}</td><td>${x.plan}</td><td>${x.today}</td><td>${c.toFixed(3)}</td><td>${pc.toFixed(1)}%</td></tr>`}).join('')}</table>
<h3>V. TỔNG HỢP CUỐI NGÀY</h3><div style="border:1px solid #ddd;min-height:32px;padding:5px;font-size:11px">${esc(ds.map(x=>x.note).filter(Boolean).join(' | '))}</div>${pics.length?'<h3>ẢNH HIỆN TRƯỜNG</h3><div class="photos">'+pics.slice(0,8).map(x=>`<img src="${x.data}">`).join('')+'</div>':''}<div class="sign"><div><b>Đội trưởng/Tổ trưởng</b></div><div><b>Lái máy</b></div><div><b>Cán bộ kỹ thuật hiện trường</b></div><div><b>Chỉ huy trưởng</b></div></div></div>`}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='NhatKyHienTruong_V3_Backup.json';a.click()}function restore(f){if(!f)return;let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);persist();alert('Đã khôi phục')}catch(e){alert('JSON không hợp lệ')}};r.readAsText(f)}function resetAll(){if(confirm('XÓA TOÀN BỘ dữ liệu?')){db={projects:[],daily:[],labor:[],machine:[],material:[],qty:[],settings:{project:''}};persist()}}
function refresh(){options();tables();dashboard();if(!$('report').classList.contains('hidden'))renderReport()}refresh();go('dash');
</script></body></html>
